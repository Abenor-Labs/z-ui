name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Registry components are real TypeScript, so a broken one fails here
      # rather than in someone else's project.
      - name: Typecheck
        run: pnpm typecheck

      # The file contract and the design laws, as checks.
      - name: Lint registry
        run: pnpm lint:registry

      # A linter that only ever passes is worthless. This deliberately breaks
      # the registry nine ways and fails if any of them slips through.
      - name: Lint the linter
        run: pnpm lint:registry:test

      # Colour is shipped, not rendered. A contrast mistake in a registry
      # component arrives in every project that ran `add`, as a file we can
      # no longer touch.
      - name: Lint contrast
        run: pnpm lint:contrast

      - name: Lint the contrast linter
        run: pnpm lint:contrast:test

      # The generated tree is committed, so it must match what the generator
      # produces from the current registry.
      - name: Check generated registry is current
        run: pnpm registry:check

      # Every workspace package that has tests. Today that is the CLI, whose
      # suite includes a tripwire asserting its copy of the spring constants
      # still matches registry/lib/z-spring — the CLI cannot import that file,
      # so nothing else would notice the two drifting apart.
      - name: Test
        run: pnpm test

      - name: Build site
        run: pnpm --filter @z-ui/site build

      # The CLI is published from dist/, so a package that typechecks but does
      # not emit is still broken for everyone who installs it.
      - name: Build CLI
        run: pnpm --filter @abenor/z-ui build
